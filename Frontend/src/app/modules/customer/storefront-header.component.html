<header class="store-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="CricDynamics home"><img src="/storefront-logo.png" alt="CricDynamics - Power your play" /></a>
    <form class="search" (ngSubmit)="searchSubmit.emit()">
      <label class="sr-only" for="catalog-search">Search products</label>
      <input id="catalog-search" name="search" [ngModel]="searchValue" (ngModelChange)="searchValueChange.emit($event)" placeholder="Search products and SKU..." />
      <button type="submit" aria-label="Search products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" /><path d="m16 16 5 5" /></svg>
      </button>
    </form>
    <div class="header-actions" aria-label="Upcoming shopping features">
      <button type="button" disabled aria-label="Wish list, coming soon" title="Wish list - coming soon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.8 4.8a5.4 5.4 0 0 0-7.6 0L12 6l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.6a5.4 5.4 0 0 0 0-7.6Z" /></svg>
        <span>Wish List</span><small>Coming soon</small>
      </button>
      <button type="button" disabled aria-label="Your account, coming soon" title="Your account - coming soon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="9" r="3" /><path d="M5.5 19c.9-3.1 3.2-4.6 6.5-4.6s5.6 1.5 6.5 4.6" /></svg>
        <span>Your Account</span><small>Coming soon</small>
      </button>
      <button type="button" disabled aria-label="Your cart, coming soon" title="Your cart - coming soon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 3h3l2.2 11.5h11.3l2.4-8.2H6" /><circle cx="9" cy="19" r="1.4" /><circle cx="18" cy="19" r="1.4" /></svg>
        <span>Your Cart</span><small>Coming soon</small>
      </button>
    </div>
  </div>
</header>
<nav class="store-nav" aria-label="Store navigation">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">HOME</a>
  <a routerLink="/customer" routerLinkActive="active">CRICKET</a>
</nav>
